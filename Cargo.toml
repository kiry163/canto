[package]
name = "canto"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
cookie_store = "0.22.1"
crossterm = "0.29.0"
dirs = "7.0.0"
global-hotkey = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "cookies", "blocking", "query", "form"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 状态行通知按**显示宽度**截断：中文/书名号是双宽，按字符数裁会把显示宽度算错。
unicode-width = "0.2.2"
url = "2.5.8"

# 平台各要一点系统接口：Unix 的 `flock`/`localtime_r`，Windows 的
# `FileTimeToSystemTime` + 时区换算。两边都不引第三方时间/加锁库。
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
# 全局热键要 `Win32_UI_WindowsAndMessaging` + `Win32_System_Threading`；
# 桌面歌词的覆盖层再加上 GDI（DIB 与画字）、HiDpi（按窗口 DPI 缩放字号）、
# LibraryLoader（`GetModuleHandleW` 拿 hinstance），而 `UpdateLayeredWindow`
# 本身也挂在 `Win32_Graphics_Gdi` 这个 feature 下。
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
