[package]
name = "canto"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cookie_store = "0.22.1"
crossterm = "0.29.0"
dirs = "7.0.0"
libc = "0.2.190"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "cookies", "blocking"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
