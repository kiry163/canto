name: release

# 打 tag（`v0.1.0` 这种）就编三平台的可执行文件并挂到 Release 上；
# 手点 workflow_dispatch 只出产物、不发 Release（免得手滑发出去）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 用 22.04 而不是 latest：编出来的 glibc 要求低（2.35），老一点的发行版也能跑。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            # 静态 CRT：目标机不用再装 VC++ 运行库。
            rustflags: -C target-feature=+crt-static
          - os: macos-15 # arm64（Apple Silicon）
            target: aarch64-apple-darwin
          # 不出 Intel Mac 的产物：老机型自己 `cargo build --release` 编就行，
          # GitHub 也在逐步下线 macos-*-intel 镜像。
    steps:
      - uses: actions/checkout@v7

      # tag 跟 Cargo.toml 的版本对不上就早点报错（不然 `canto --version` 跟 Release 名不一致）。
      - name: 检查 tag 与 Cargo.toml 版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -nE 's/^version *= *"(.*)"/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "tag 是 v$want，Cargo.toml 里写的是 $have" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 系统依赖（cpal 在 Linux 上要 ALSA 头文件）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # 先测再打包：宁可这次不发，也别把没在这台机器上测过的二进制发出去。
      - name: 测试
        run: cargo test --locked --target ${{ matrix.target }}
      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: 打包（unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/canto" dist/stage/canto
          tar -czf "dist/canto-${{ matrix.target }}.tar.gz" -C dist/stage canto
      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/canto.exe" dist/stage/canto.exe
          Compress-Archive -Path dist/stage/canto.exe -DestinationPath "dist/canto-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: canto-${{ matrix.target }}
          path: dist/canto-*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这一步没 checkout，`gh` 得靠它认仓库。
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # 重跑工作流时覆盖同名产物，而不是报错退出。
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "$tag" --generate-notes dist/*
          fi
